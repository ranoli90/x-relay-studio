name: ci

on:
  push:
    branches: [main, fix/**]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: node scripts/check-migration-unique.mjs
      - run: npm test
      - run: npx tsc --noEmit
